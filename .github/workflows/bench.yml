name: jni-vs-ffm-bench

# One job per (platform, arch, chunk). Chunks are selected by SIGNATURE (the cType) via tools/RunChunk,
# so the ffm_<sig> and jni_<sig> benchmarks always run on the same machine -- the ffm/jni comparison
# never crosses machines.
#
# Per-platform settings (warmup/measurement) are in the matrix:
#   linux   : warmup 30x50ms  , measure 10x100ms
#   windows : warmup 30x50ms  , measure 20x100ms
#   macos   : warmup 30x100ms , measure 10x100ms , split into 2 chunks (2 jobs each, in parallel)
#
# GitHub-hosted jobs are hard-capped at 6h; every job below is comfortably under that.

on:
  workflow_dispatch:
    inputs:
      warmupIterations:
        description: Override warmup iterations (all platforms)
        required: false
        default: ''
      warmupTime:
        description: Override warmup time per iteration (all platforms)
        required: false
        default: ''
      measurementIterations:
        description: Override measurement iterations (all platforms)
        required: false
        default: ''
      measurementTime:
        description: Override measurement time per iteration (all platforms)
        required: false
        default: ''
      forks:
        description: Forks
        required: false
        default: '1'
      threads:
        description: Threads
        required: false
        default: '1'

  push:
    branches: [main]
    paths:
      - '.github/workflows/bench.yml'
      - 'dist/**'
      - 'libs/**'
      - 'tools/**'

permissions:
  contents: read

env:
  DEF_FORKS: '1'
  DEF_THREADS: '1'
  DEF_JVM_ARGS: >-
    --enable-native-access=ALL-UNNAMED
    --add-exports=java.base/jdk.internal.access=ALL-UNNAMED
    --add-exports=java.base/jdk.internal.foreign=ALL-UNNAMED
    --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED
    --add-exports=java.base/jdk.internal.util=ALL-UNNAMED

jobs:
  bench:
    name: ${{ matrix.platform }}-${{ matrix.arch }}-c${{ matrix.chunk }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # jar = platform native jar under dist/ ; mi = measurement iterations ; wt = warmup time ; chunks = split count
          - { os: ubuntu-latest,    platform: linux,   arch: x64,   chunk: 0, chunks: 1, wi: 30, wt: 50ms,  mi: 10, jar: fjgl-0.3.0-natives-linux.jar,         sep: ':', distribution: temurin }
          - { os: ubuntu-24.04-arm, platform: linux,   arch: arm64, chunk: 0, chunks: 1, wi: 30, wt: 50ms,  mi: 10, jar: fjgl-0.3.0-natives-linux-arm64.jar,   sep: ':', distribution: temurin }
          - { os: windows-latest,   platform: windows, arch: x64,   chunk: 0, chunks: 1, wi: 30, wt: 50ms,  mi: 20, jar: fjgl-0.3.0-natives-windows.jar,       sep: ';', distribution: temurin }
          - { os: windows-11-arm,   platform: windows, arch: arm64, chunk: 0, chunks: 1, wi: 30, wt: 50ms,  mi: 20, jar: fjgl-0.3.0-natives-windows-arm64.jar, sep: ';', distribution: microsoft }
          - { os: macos-15-intel,   platform: macos,   arch: x64,   chunk: 0, chunks: 2, wi: 30, wt: 100ms, mi: 10, jar: fjgl-0.3.0-natives-macos.jar,         sep: ':', distribution: temurin }
          - { os: macos-15-intel,   platform: macos,   arch: x64,   chunk: 1, chunks: 2, wi: 30, wt: 100ms, mi: 10, jar: fjgl-0.3.0-natives-macos.jar,         sep: ':', distribution: temurin }
          - { os: macos-14,         platform: macos,   arch: arm64, chunk: 0, chunks: 2, wi: 30, wt: 100ms, mi: 10, jar: fjgl-0.3.0-natives-macos-arm64.jar,   sep: ':', distribution: temurin }
          - { os: macos-14,         platform: macos,   arch: arm64, chunk: 1, chunks: 2, wi: 30, wt: 100ms, mi: 10, jar: fjgl-0.3.0-natives-macos-arm64.jar,   sep: ':', distribution: temurin }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: '25'

      - name: Compile tools
        shell: bash
        run: javac -cp libs/jmh-core.jar -d tools/classes tools/EnvInfo.java tools/Flatten.java tools/RunChunk.java

      - name: Collect environment
        shell: bash
        run: |
          mkdir -p out
          java -cp tools/classes EnvInfo "out/env-${{ matrix.platform }}-${{ matrix.arch }}-c${{ matrix.chunk }}.json"

      - name: Print environment
        shell: bash
        run: |
          ENV="out/env-${{ matrix.platform }}-${{ matrix.arch }}-c${{ matrix.chunk }}.json"
          echo "--- $ENV ---"; cat "$ENV"
          {
            echo "### ${{ matrix.platform }}-${{ matrix.arch }}-c${{ matrix.chunk }}"
            echo '```json'; cat "$ENV"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run JMH chunk
        shell: bash
        env:
          SEP: ${{ matrix.sep }}
          IN_WI: ${{ github.event.inputs.warmupIterations }}
          IN_WT: ${{ github.event.inputs.warmupTime }}
          IN_MI: ${{ github.event.inputs.measurementIterations }}
          IN_MT: ${{ github.event.inputs.measurementTime }}
          IN_FK: ${{ github.event.inputs.forks }}
          IN_TH: ${{ github.event.inputs.threads }}
        run: |
          WI="${IN_WI:-${{ matrix.wi }}}"
          WT="${IN_WT:-${{ matrix.wt }}}"
          MI="${IN_MI:-${{ matrix.mi }}}"
          MT="${IN_MT:-100ms}"
          FK="${IN_FK:-$DEF_FORKS}"
          TH="${IN_TH:-$DEF_THREADS}"
          TAG="${{ matrix.platform }}-${{ matrix.arch }}-c${{ matrix.chunk }}"
          CP="tools/classes${SEP}dist/fjgl-0.3.0.jar${SEP}dist/${{ matrix.jar }}${SEP}libs/*"
          echo "chunk=${{ matrix.chunk }}/${{ matrix.chunks }}  warmup=$WI x $WT  measure=$MI x $MT  forks=$FK threads=$TH"
          java $DEF_JVM_ARGS -cp "$CP" RunChunk ${{ matrix.chunk }} ${{ matrix.chunks }} \
            -wi "$WI" -w "$WT" -i "$MI" -r "$MT" -f "$FK" -t "$TH" \
            -bm avgt -tu ns \
            -rf json -rff "out/jmh-$TAG.json" \
            -jvmArgsAppend "$DEF_JVM_ARGS"

      - name: Flatten to CSV
        if: always()
        shell: bash
        run: |
          TAG="${{ matrix.platform }}-${{ matrix.arch }}-c${{ matrix.chunk }}"
          if [ -f "out/jmh-$TAG.json" ]; then
            java -cp tools/classes Flatten "out/env-$TAG.json" "out/jmh-$TAG.json" "out/results-$TAG.csv" "out/calls-$TAG.csv" "$TAG"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.platform }}-${{ matrix.arch }}-c${{ matrix.chunk }}
          path: out/
          if-no-files-found: warn

  merge:
    name: merge
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Merge CSVs
        if: always()
        shell: bash
        run: |
          mkdir -p merged
          find artifacts -name 'results-*.csv' -exec cp {} merged/ \; 2>/dev/null || true
          ls -la merged || true
          shopt -s nullglob
          files=(merged/results-*.csv)
          if [ ${#files[@]} -eq 0 ]; then echo "no result CSVs"; exit 0; fi
          head -1 "${files[0]}" > results-all.csv
          for f in "${files[@]}"; do tail -n +2 "$f" >> results-all.csv; done
          wc -l results-all.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-all
          path: results-all.csv
          if-no-files-found: warn
