name: jni-vs-ffm-bench

# Every job runs the prebuilt dist/fjgl-0.3.0.jar (which already contains DowncallJniBench and its
# JMH harness) against the platform native jar, collects the machine environment and uploads the
# result files.
#
# Note: GitHub-hosted jobs are hard-capped at 6 hours. With the defaults below (30x100ms warmup,
# 50x100ms measurement, 1 fork => 50 raw samples per benchmark) a full run of all 2030 benchmarks
# takes roughly 5 hours per platform. To collect more samples or use multiple forks, split the run
# by passing a narrower "filter" and run the workflow several times.

on:
  # Manual run: Actions -> jni-vs-ffm-bench -> Run workflow. The inputs here override the defaults.
  workflow_dispatch:
    inputs:
      filter:
        description: JMH benchmark regex
        required: false
        default: '.*DowncallJniBench.*'
      warmupIterations:
        description: Warmup iterations
        required: false
        default: '30'
      warmupTime:
        description: Warmup time per iteration
        required: false
        default: '100ms'
      measurementIterations:
        description: Measurement iterations
        required: false
        default: '50'
      measurementTime:
        description: Measurement time per iteration
        required: false
        default: '100ms'
      forks:
        description: Forks
        required: false
        default: '1'
      threads:
        description: Threads
        required: false
        default: '1'
      jvmArgs:
        description: JVM arguments forwarded to the driver and to every fork
        required: false
        default: >-
          --enable-native-access=ALL-UNNAMED
          --add-exports=java.base/jdk.internal.access=ALL-UNNAMED
          --add-exports=java.base/jdk.internal.foreign=ALL-UNNAMED
          --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED
          --add-exports=java.base/jdk.internal.util=ALL-UNNAMED

  # Automatic run on every push to main that touches the harness.
  push:
    branches: [main]
    paths:
      - '.github/workflows/bench.yml'
      - 'dist/**'
      - 'libs/**'
      - 'tools/**'

  # Automatic weekly run (uncomment to enable).
  # schedule:
  #   - cron: '0 3 * * 0'

permissions:
  contents: read

# Defaults used when the workflow is not started via workflow_dispatch (e.g. push) or when an input
# is left empty. Keep these in sync with the workflow_dispatch defaults above.
env:
  DEF_FILTER: '.*DowncallJniBench.*'
  DEF_WARMUP_ITERATIONS: '30'
  DEF_WARMUP_TIME: '100ms'
  DEF_MEASUREMENT_ITERATIONS: '50'
  DEF_MEASUREMENT_TIME: '100ms'
  DEF_FORKS: '1'
  DEF_THREADS: '1'
  DEF_JVM_ARGS: >-
    --enable-native-access=ALL-UNNAMED
    --add-exports=java.base/jdk.internal.access=ALL-UNNAMED
    --add-exports=java.base/jdk.internal.foreign=ALL-UNNAMED
    --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED
    --add-exports=java.base/jdk.internal.util=ALL-UNNAMED

jobs:
  bench:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native jar name must match a file committed under dist/
          # Temurin has no JDK 25 for Windows arm64, so that one uses the Microsoft build.
          - { os: ubuntu-latest,    platform: linux,   arch: x64,   jar: fjgl-0.3.0-natives-linux.jar,         sep: ':', distribution: temurin }
          - { os: ubuntu-24.04-arm, platform: linux,   arch: arm64, jar: fjgl-0.3.0-natives-linux-arm64.jar,   sep: ':', distribution: temurin }
          - { os: windows-latest,   platform: windows, arch: x64,   jar: fjgl-0.3.0-natives-windows.jar,       sep: ';', distribution: temurin }
          - { os: windows-11-arm,   platform: windows, arch: arm64, jar: fjgl-0.3.0-natives-windows-arm64.jar, sep: ';', distribution: microsoft }
          - { os: macos-13,         platform: macos,   arch: x64,   jar: fjgl-0.3.0-natives-macos.jar,         sep: ':', distribution: temurin }
          - { os: macos-14,         platform: macos,   arch: arm64, jar: fjgl-0.3.0-natives-macos-arm64.jar,   sep: ':', distribution: temurin }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: '25'

      - name: Compile tools
        shell: bash
        run: javac -d tools/classes tools/EnvInfo.java tools/Flatten.java

      - name: Collect environment
        shell: bash
        run: |
          mkdir -p out
          java -cp tools/classes EnvInfo "out/env-${{ matrix.platform }}-${{ matrix.arch }}.json"

      - name: Print environment
        shell: bash
        run: |
          ENV="out/env-${{ matrix.platform }}-${{ matrix.arch }}.json"
          echo "--- $ENV ---"
          cat "$ENV"
          {
            echo "### Environment ${{ matrix.platform }}-${{ matrix.arch }}"
            echo '```json'
            cat "$ENV"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run JMH
        shell: bash
        env:
          SEP: ${{ matrix.sep }}
          IN_FILTER: ${{ github.event.inputs.filter }}
          IN_WARMUP_ITERATIONS: ${{ github.event.inputs.warmupIterations }}
          IN_WARMUP_TIME: ${{ github.event.inputs.warmupTime }}
          IN_MEASUREMENT_ITERATIONS: ${{ github.event.inputs.measurementIterations }}
          IN_MEASUREMENT_TIME: ${{ github.event.inputs.measurementTime }}
          IN_FORKS: ${{ github.event.inputs.forks }}
          IN_THREADS: ${{ github.event.inputs.threads }}
          IN_JVM_ARGS: ${{ github.event.inputs.jvmArgs }}
        run: |
          FILTER="${IN_FILTER:-$DEF_FILTER}"
          WI="${IN_WARMUP_ITERATIONS:-$DEF_WARMUP_ITERATIONS}"
          WT="${IN_WARMUP_TIME:-$DEF_WARMUP_TIME}"
          MI="${IN_MEASUREMENT_ITERATIONS:-$DEF_MEASUREMENT_ITERATIONS}"
          MT="${IN_MEASUREMENT_TIME:-$DEF_MEASUREMENT_TIME}"
          FK="${IN_FORKS:-$DEF_FORKS}"
          TH="${IN_THREADS:-$DEF_THREADS}"
          JVM="${IN_JVM_ARGS:-$DEF_JVM_ARGS}"

          CP="dist/fjgl-0.3.0.jar${SEP}dist/${{ matrix.jar }}${SEP}libs/*"
          echo "classpath:        $CP"
          echo "filter:           $FILTER"
          echo "warmup:           $WI x $WT"
          echo "measurement:      $MI x $MT"
          echo "forks/threads:    $FK / $TH"
          echo "jvmArgs:          $JVM"

          java $JVM -cp "$CP" org.openjdk.jmh.Main \
            "$FILTER" \
            -wi "$WI" \
            -i "$MI" \
            -w "$WT" \
            -r "$MT" \
            -f "$FK" \
            -t "$TH" \
            -bm avgt \
            -tu ns \
            -rf json \
            -rff "out/jmh-${{ matrix.platform }}-${{ matrix.arch }}.json" \
            -jvmArgsAppend "$JVM"

      - name: Flatten to CSV
        if: always()
        shell: bash
        run: |
          if [ -f "out/jmh-${{ matrix.platform }}-${{ matrix.arch }}.json" ]; then
            java -cp tools/classes Flatten \
              "out/env-${{ matrix.platform }}-${{ matrix.arch }}.json" \
              "out/jmh-${{ matrix.platform }}-${{ matrix.arch }}.json" \
              "out/results-${{ matrix.platform }}-${{ matrix.arch }}.csv" \
              "out/calls-${{ matrix.platform }}-${{ matrix.arch }}.csv"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: warn

  merge:
    name: merge
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Merge CSVs
        if: always()
        shell: bash
        run: |
          mkdir -p merged
          find artifacts -name 'results-*.csv' -exec cp {} merged/ \; 2>/dev/null || true
          ls -la merged || true
          shopt -s nullglob
          files=(merged/results-*.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no result CSVs found"
            exit 0
          fi
          head -1 "${files[0]}" > results-all.csv
          for f in "${files[@]}"; do tail -n +2 "$f" >> results-all.csv; done
          wc -l results-all.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-all
          path: results-all.csv
          if-no-files-found: warn
